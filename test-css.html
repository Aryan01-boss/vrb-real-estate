<!DOCTYPE html>
<html>
<head>
  <style>
    .image-reveal { clip-path: inset(0 0 100% 0); transition: clip-path 1000ms cubic-bezier(.2,.7,.2,1), opacity 500ms ease; }
    .is-visible { clip-path: inset(0 0 0 0); }
  </style>
</head>
<body>
  <div class="image-reveal is-visible" style="width: 100px; height: 100px; background: red;"></div>
</body>
</html>
